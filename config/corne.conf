# Battery Level
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Display: desabilite se nao tiver OLED conectado
# CONFIG_ZMK_DISPLAY=y

# RGB Underglow: desabilite se nao tiver LEDs ou para diagnostico
# CONFIG_ZMK_RGB_UNDERGLOW=y
